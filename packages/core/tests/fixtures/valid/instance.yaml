schemaVersion: coga.dev/v0.2
kind: CogaInstance
metadata:
  id: example.broker-channel.instance
  title: Example broker digital channel factory
  version: 0.2.0
  lifecycle: candidate
  scope: instance
  visibility: public
  attestations: []
spec:
  domain:
    name: Broker digital customer channels
    boundary: Produces customer-facing channel applications backed by explicit service contracts.
    nonGoals:
      - Financial research and pricing engines
  packages:
    - id: example.broker-channel.domain
      version: 0.2.0
      path: packages/domain.yaml
    - id: example.broker-channel.operations
      version: 0.2.0
      path: packages/operations.yaml
  applications:
    - id: example.application.demo
      version: 0.2.0
      path: applications/demo.yaml
  governance:
    extensions: {}
    approvalRules:
      - lifecycle: published
        policies:
          - id: fixture.release.approval-policy
            version: 0.2.0
    releaseEvidence:
      - lifecycle: published
        evidence:
          - evidence/release-approval.md
