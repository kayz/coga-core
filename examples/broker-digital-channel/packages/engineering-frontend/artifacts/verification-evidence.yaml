schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: frontend.client.verification.evidence
  title: Frontend candidate evidence
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.engineering.stewards
  tags:
    - testing
    - evidence
spec:
  artifactType: capability
  summary: >-
    Each frontend candidate produces reviewable evidence tied to the exact source
    and harness dependency locks.
  statement: >-
    Candidate evidence identifies revisions and records static analysis, unit and
    component results, contract compatibility, core journey outcomes, accessibility
    checks, visual changes where relevant, and target-specific build budgets. A
    failure remains visible and cannot be replaced by agent confidence.
  scope: >-
    Applies before application merge or delivery-candidate promotion; the exact test
    tools and risk thresholds are selected by the application and organization.
  provenance:
    - source: https://cucumber.io/docs/gherkin/reference/
      sourceType: standard
      note: Cucumber Gherkin Reference
    - source: https://www.w3.org/TR/WCAG22/
      sourceType: standard
      note: Web Content Accessibility Guidelines 2.2
  relations:
    - type: verifies
      target: frontend.client.state.explicit
    - type: verifies
      target: frontend.client.accessible.interaction
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: frontend.client.scenario.contract.and.state
      validator: coga.validation.scenario.reference
    - type: scenario
      status: passed
      target: frontend.client.scenario.accessibility
      validator: coga.validation.scenario.reference
  contractRefs:
    - id: contract.frontend.candidate.evidence
      version: 0.1.0
      path: ../../../contracts/frontend-candidate-evidence.schema.json
