kind: DomainArtifact
metadata:
  id: frontend.client.verification.evidence
  title: Frontend candidate evidence
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.engineering.stewards
  tags:
    - testing
    - evidence
  attestations: []
spec:
  artifactType: capability
  summary:
    Each frontend candidate produces reviewable evidence tied to the exact source and harness
    dependency locks.
  statement:
    Candidate evidence identifies revisions and records static analysis, unit and component
    results, contract compatibility, core journey outcomes, accessibility checks, visual changes
    where relevant, and target-specific build budgets. A failure remains visible and cannot be
    replaced by agent confidence.
  scope:
    Applies before application merge or delivery-candidate promotion; the exact test tools and
    risk thresholds are selected by the application and organization.
  provenance:
    - source: https://cucumber.io/docs/gherkin/reference/
      sourceType: standard
      note: Cucumber Gherkin Reference
    - source: https://www.w3.org/TR/WCAG22/
      sourceType: standard
      note: Web Content Accessibility Guidelines 2.2
  relations:
    - type: verifies
      target:
        id: frontend.client.state.explicit
        version: 0.2.0
    - type: verifies
      target:
        id: frontend.client.accessible.interaction
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: frontend.client.scenario.contract.and.state
        version: 0.2.0
    - type: scenario
      status: pending
