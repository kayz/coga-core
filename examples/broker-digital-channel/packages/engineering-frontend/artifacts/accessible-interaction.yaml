schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: frontend.client.accessible.interaction
  title: Accessible critical interaction
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.engineering.stewards
  tags:
    - accessibility
    - interaction
spec:
  artifactType: policy
  summary: >-
    Critical content and actions remain understandable without relying on color,
    pointer precision, or an unlabeled visual control.
  statement: >-
    Interactive elements expose a meaningful name, role, state, and usable target;
    focus and reading order follow the journey; status and validation messages are
    programmatically perceivable; and financial or legal actions include error
    prevention appropriate to the application's risk assessment.
  scope: >-
    Applies to core application journeys. Platform-specific accessibility support is
    evaluated and documented where full web semantics are unavailable.
  provenance:
    - source: https://www.w3.org/TR/WCAG22/
      sourceType: standard
      note: Web Content Accessibility Guidelines 2.2
  relations:
    - type: applies-to
      target: frontend.client.scenario.accessibility
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: frontend.client.scenario.accessibility
      validator: coga.validation.scenario.reference
  contractRefs: []
