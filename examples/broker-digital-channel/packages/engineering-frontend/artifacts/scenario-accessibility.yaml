  tags:
    - scenario
    - accessibility
  attestations: []
spec:
  artifactType: scenario
  summary: An observable example for critical content, control, and status semantics.
  statement: |-
    Scenario: a critical action reports validation and completion
      Given a user navigates the journey without relying on color alone
      When validation prevents the action
      Then each error identifies the affected input and corrective meaning
      When the corrected action completes asynchronously
      Then the completion status is programmatically perceivable
      And focus or reading order remains predictable
  scope: Reused for each application's selected core journeys with target-specific test adapters.
  provenance:
    - source: https://www.w3.org/TR/WCAG22/
      sourceType: standard
      note: Web Content Accessibility Guidelines 2.2
