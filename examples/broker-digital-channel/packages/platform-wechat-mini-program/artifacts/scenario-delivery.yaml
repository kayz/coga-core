spec:
  artifactType: scenario
  summary: An observable example for package evidence and credential isolation.
  statement: |-
    Scenario: build evidence reveals a package regression
      Given an application declares package and loading budgets
      When the locked candidate is built by the delivery adapter
      Then the evidence identifies the application and harness revisions
      And the package report is compared with those budgets
      And a failed budget blocks candidate promotion without exposing credentials
  scope: Reused by mini-program application build and release-candidate preparation.
