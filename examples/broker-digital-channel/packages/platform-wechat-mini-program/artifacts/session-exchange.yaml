schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: wechat.miniprogram.session.exchange
  title: WeChat session exchange boundary
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.platform.stewards
  tags:
    - session
    - authentication
  attestations: []
spec:
  artifactType: rule
  summary:
    A temporary mini-program login credential is exchanged by a trusted backend and is not
    itself a durable customer identity or client-side authorization.
  statement:
    The client obtains a temporary login credential through the platform flow and sends it
    only to the configured trusted backend exchange. Secrets, durable session authority, and
    platform-to-customer identity mapping remain server-side. Expired or failed exchange returns the
    client to an explicit unauthenticated state without treating cached profile data as authority.
  scope:
    Applies to WeChat mini-program applications that establish an application session or
    associate a platform user with a backend customer context.
  provenance:
    - source: https://developers.weixin.qq.com/miniprogram/dev/framework/open-ability/login.html
      sourceType: document
      note: 小程序登录
  relations:
    - type: depends-on
      target:
        id: broker.channel.identity.context
        version: 0.2.0
    - type: applies-to
      target:
        id: wechat.miniprogram.scenario.session.and.privacy
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: wechat.miniprogram.scenario.session.and.privacy
        version: 0.2.0
  contractRefs: []
