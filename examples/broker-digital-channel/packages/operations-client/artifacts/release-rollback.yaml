schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: client.operations.release.rollback
  title: Client release rollback runbook
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.operations.stewards
  tags:
    - release
    - rollback
  attestations: []
spec:
  artifactType: runbook
  summary:
    A client release records a last-known-good candidate and a target-appropriate, pre-reviewed
    recovery path.
  statement: >-
    1. Before promotion, record the candidate revision, exact harness locks, contract locks,
    evidence, and last-known-good revision.

    2. Confirm that the delivery target supports the chosen recovery mechanism and document platform
    latency or review constraints.

    3. When rollback criteria are met, stop further promotion and invoke the approved reversible
    mechanism.

    4. Verify the critical user journey and monitoring against the restored revision; do not close
    from deployment status alone.

    5. Preserve the failed candidate and sanitized evidence for diagnosis, then add a regression
    scenario before retrying promotion.
  scope:
    Applies to client release preparation and mitigation. It does not authorize a production
    release, platform review action, or environment administration.
  provenance:
    - source: https://sre.google/workbook/canarying-releases/
      sourceType: document
      note: Google SRE Workbook — Canarying Releases
    - source: https://sre.google/workbook/incident-response/
      sourceType: document
      note: Google SRE Workbook — Incident Response
  relations:
    - type: depends-on
      target:
        id: frontend.client.verification.evidence
        version: 0.2.0
    - type: applies-to
      target:
        id: client.operations.scenario.release
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: client.operations.scenario.release
        version: 0.2.0
    - type: review
      status: pending
  contractRefs: []
