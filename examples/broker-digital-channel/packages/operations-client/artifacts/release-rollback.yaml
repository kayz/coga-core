schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: client.operations.release.rollback
  title: Client release rollback runbook
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.operations.stewards
  tags:
    - release
    - rollback
spec:
  artifactType: runbook
  summary: >-
    A client release records a last-known-good candidate and a target-appropriate,
    pre-reviewed recovery path.
  statement: |-
    1. Before promotion, record the candidate revision, exact harness locks, contract locks, evidence, and last-known-good revision.
    2. Confirm that the delivery target supports the chosen recovery mechanism and document platform latency or review constraints.
    3. When rollback criteria are met, stop further promotion and invoke the approved reversible mechanism.
    4. Verify the critical user journey and monitoring against the restored revision; do not close from deployment status alone.
    5. Preserve the failed candidate and sanitized evidence for diagnosis, then add a regression scenario before retrying promotion.
  scope: >-
    Applies to client release preparation and mitigation. It does not authorize a
    production release, platform review action, or environment administration.
  provenance:
    - source: https://sre.google/workbook/canarying-releases/
      sourceType: document
      note: Google SRE Workbook — Canarying Releases
    - source: https://sre.google/workbook/incident-response/
      sourceType: document
      note: Google SRE Workbook — Incident Response
  relations:
    - type: depends-on
      target: frontend.client.verification.evidence
    - type: applies-to
      target: client.operations.scenario.release
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: client.operations.scenario.release
      validator: coga.validation.scenario.reference
    - type: review
      status: passed
      validator: coga.review.operations.owner
  contractRefs: []
