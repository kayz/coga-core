schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: client.operations.incident.triage
  title: Client incident triage runbook
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.operations.stewards
  tags:
    - incident
    - runbook
spec:
  artifactType: runbook
  summary: >-
    Triage establishes user impact and ownership before diagnosis, preserving an
    evidence timeline without exposing private data.
  statement: |-
    1. Confirm the alert or report against observable user impact; do not infer severity from event count alone.
    2. Identify application revision, harness locks, delivery target, affected journey, and last known good revision.
    3. Classify whether the failure is client code, contract compatibility, backend availability, platform behavior, or unknown.
    4. Assign an incident owner and record actions, evidence, timestamps, and decisions in the authorized system.
    5. Mitigate with the smallest reversible action; use the rollback runbook when a recent candidate is implicated.
    6. Verify recovery from the user's path and monitoring, then create a sanitized regression candidate from the learned failure.
  scope: >-
    Applies to deployed client-application defects and degraded journeys. Real
    paging, severity, communication, and escalation bindings are organization-owned.
  provenance:
    - source: https://sre.google/workbook/incident-response/
      sourceType: document
      note: Google SRE Workbook — Incident Response
  relations:
    - type: depends-on
      target: client.operations.telemetry.minimization
    - type: depends-on
      target: client.operations.release.rollback
    - type: applies-to
      target: client.operations.scenario.incident
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: client.operations.scenario.incident
      validator: coga.validation.scenario.reference
    - type: review
      status: passed
      validator: coga.review.operations.owner
  contractRefs: []
