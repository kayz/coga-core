schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: broker.channel.suitability.boundary
  title: Suitability authority boundary
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.domain.stewards
  tags:
    - suitability
    - investor-protection
  attestations: []
spec:
  artifactType: rule
  summary:
    Content discovery and interface availability do not prove that a product or service is
    suitable or available to a particular customer.
  statement:
    Before a suitability-sensitive or transaction-adjacent action, the client must obtain the
    current decision and required disclosures from an authoritative backend contract. It must not
    calculate, cache as authority, or override an investor classification, product classification,
    matching result, or exception.
  scope:
    Applies to client journeys that move from general information toward a personalized
    recommendation, service enrollment, or transaction-related action.
  provenance:
    - source: https://www.csrc.gov.cn/csrc/c101939/c1045348/content.shtml
      sourceType: standard
      note: 证券期货投资者适当性管理办法
  relations:
    - type: depends-on
      target:
        id: broker.channel.content.provenance
        version: 0.2.0
    - type: applies-to
      target:
        id: broker.channel.scenario.content.and.suitability
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: broker.channel.scenario.content.and.suitability
        version: 0.2.0
    - type: review
      status: pending
  contractRefs: []
