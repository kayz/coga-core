schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: broker.channel.entitlement.authority
  title: Authoritative entitlement behavior
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.domain.stewards
  tags:
    - authorization
    - fail-closed
  attestations: []
spec:
  artifactType: rule
  summary:
    Client applications render protected capabilities only from current, backend-issued
    authorization evidence.
  statement:
    The client must not infer or elevate an entitlement from platform identity, cached
    presentation state, local configuration, or a visible control. When authorization evidence is
    missing, expired, malformed, or contradictory, the client denies the protected action or
    presents an explicitly safe degraded state and requests fresh authority.
  scope:
    Applies to every protected capability exposed through a broker digital customer channel;
    exact entitlement policy remains backend- and application-owned.
  provenance:
    - source: https://owasp.org/www-project-application-security-verification-standard/
      sourceType: standard
      note: OWASP Application Security Verification Standard
    - source: https://pages.nist.gov/800-63-4/
      sourceType: standard
      note: NIST SP 800-63 Digital Identity Guidelines
  relations:
    - type: depends-on
      target:
        id: broker.channel.identity.context
        version: 0.2.0
    - type: applies-to
      target:
        id: broker.channel.scenario.identity.and.entitlement
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: broker.channel.scenario.identity.and.entitlement
        version: 0.2.0
  contractRefs: []
