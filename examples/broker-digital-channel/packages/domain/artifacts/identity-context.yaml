schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: broker.channel.identity.context
  title: Channel identity context
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.domain.stewards
  tags:
    - identity
    - trust-boundary
spec:
  artifactType: concept
  summary: >-
    A channel identity context keeps platform identity, authenticated customer
    identity, account links, and authorization evidence distinct.
  statement: >-
    A platform identifier proves only the platform session represented by its
    issuer. A client channel may act for a broker customer only after a trusted
    backend supplies an authenticated customer context and current authorization
    evidence. Account links are references, not client-owned identity proof.
  scope: >-
    Applies whenever a public client channel maps a delivery-platform session to a
    broker customer or account-related experience.
  provenance:
    - source: https://pages.nist.gov/800-63-4/
      sourceType: standard
      note: NIST SP 800-63 Digital Identity Guidelines
  relations:
    - type: depends-on
      target: broker.channel.personal.data.minimization
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: broker.channel.scenario.identity.and.entitlement
      validator: coga.validation.scenario.reference
  contractRefs: []
