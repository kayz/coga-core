schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: broker.channel.scenario.data.denial
  title: Optional data denial scenario
  version: 0.1.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.domain.stewards
  tags:
    - scenario
    - privacy
spec:
  artifactType: scenario
  summary: >-
    An observable privacy example for denied optional data collection.
  statement: |-
    Scenario: optional collection is denied
      Given a capability requests personal data that is optional for the core journey
      When the user denies the request
      Then the application explains the limited effect without coercion
      And no placeholder identifier or raw denial payload enters telemetry
      And the unaffected journey remains available
  scope: >-
    Reused by applications that request optional personal data or platform
    permissions.
  provenance:
    - source: https://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html
      sourceType: standard
      note: 中华人民共和国个人信息保护法
  relations:
    - type: verifies
      target: broker.channel.personal.data.minimization
  validation:
    - type: review
      status: passed
      validator: coga.review.domain.privacy
  contractRefs: []
