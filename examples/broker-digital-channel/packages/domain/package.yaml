      path: artifacts/suitability-boundary.yaml
    - id: broker.channel.content.provenance
      version: 0.2.0
      path: artifacts/content-provenance.yaml
    - id: broker.channel.personal.data.minimization
      version: 0.2.0
      path: artifacts/personal-data-minimization.yaml
    - id: broker.channel.scenario.identity.and.entitlement
      version: 0.2.0
      path: artifacts/scenario-identity-and-entitlement.yaml
    - id: broker.channel.scenario.content.and.suitability
      version: 0.2.0
      path: artifacts/scenario-content-and-suitability.yaml
    - id: broker.channel.scenario.data.denial
