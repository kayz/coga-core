schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: example.organization.publication.allowlist
  title: Example public publication allowlist
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.organization.stewards
  tags:
    - publication
    - sanitization
  attestations: []
spec:
  artifactType: policy
  summary:
    Public export is allowlist-based and accepts only explicitly public, instance-scoped
    resources whose sources and content pass sanitization review.
  statement:
    A public bundle includes only resources marked with instance scope and public visibility.
    It rejects unresolved local references, secrets, personal data, private endpoints, organization
    identifiers, screenshots, exact entitlement amounts, proprietary API material, and copied
    private requirements. A human reviews the final inventory and diff before publication.
  scope:
    Applies to this illustrative public instance and any derived example bundle; a real
    organization maintains additional private detection rules outside it.
  provenance:
    - source: https://csrc.nist.gov/pubs/sp/800/218/final
      sourceType: standard
      note: NIST Secure Software Development Framework (SP 800-218)
  relations:
    - type: applies-to
      target:
        id: example.organization.scenario.publication
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: example.organization.scenario.publication
        version: 0.2.0
    - type: review
      status: pending
  contractRefs: []
