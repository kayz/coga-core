schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: example.organization.change.approval
  title: Example human approval policy
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.organization.stewards
  tags:
    - approval
    - change-control
  attestations: []
spec:
  artifactType: policy
  summary:
    Shared semantic changes and risk-bearing application changes require explicit human
    ownership and evidence before promotion.
  statement:
    A domain owner approves changes to shared meaning. A platform or engineering owner
    approves affected technical constraints. Privacy, suitability, authorization, secret-handling,
    and production-impacting changes additionally require the responsible organization reviewer. The
    proposing agent cannot serve as an approver, and missing evidence blocks promotion.
  scope:
    This is a fictitious example. A real deployment replaces role IDs, risk policy, repository
    protections, and escalation bindings in a private overlay.
  provenance:
    - source: https://csrc.nist.gov/pubs/sp/800/218/final
      sourceType: standard
      note: NIST Secure Software Development Framework (SP 800-218)
  relations:
    - type: applies-to
      target:
        id: example.organization.scenario.governed.change
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: example.organization.scenario.governed.change
        version: 0.2.0
    - type: review
      status: pending
  contractRefs: []
