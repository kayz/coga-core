schemaVersion: coga.dev/v0.1
kind: DomainArtifact
metadata:
  id: example.organization.secret.isolation
  title: Example secret isolation policy
  version: 0.1.0
  lifecycle: published
  scope: instance
  visibility: public
  owners:
    - example.organization.stewards
  tags:
    - secrets
    - evidence
spec:
  artifactType: policy
  summary: >-
    Secret material enters a task only through an authorized execution binding and
    never through source, prompts, artifacts, fixtures, or logs.
  statement: >-
    Manifests reference a secret capability by stable non-secret ID. The execution
    environment resolves that reference only for the smallest required operation.
    Evidence records whether a binding was used, not its value. A suspected exposure
    stops the task and invokes the organization's rotation and incident procedure.
  scope: >-
    Applies to repositories, local tasks, agent context, build systems, platform
    uploads, diagnostics, and generated evidence.
  provenance:
    - source: https://owasp.org/www-project-application-security-verification-standard/
      sourceType: standard
      note: OWASP Application Security Verification Standard
    - source: https://csrc.nist.gov/pubs/sp/800/218/final
      sourceType: standard
      note: NIST Secure Software Development Framework (SP 800-218)
  relations:
    - type: applies-to
      target: frontend.client.verification.evidence
    - type: applies-to
      target: example.organization.scenario.governed.change
  validation:
    - type: schema
      status: passed
      validator: coga.validation.domain.artifact.schema
    - type: scenario
      status: passed
      target: example.organization.scenario.governed.change
      validator: coga.validation.scenario.reference
    - type: review
      status: passed
      validator: coga.review.organization.security
  contractRefs: []
