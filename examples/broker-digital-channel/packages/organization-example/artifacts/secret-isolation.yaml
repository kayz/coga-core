schemaVersion: coga.dev/v0.2
kind: DomainArtifact
metadata:
  id: example.organization.secret.isolation
  title: Example secret isolation policy
  version: 0.2.0
  lifecycle: approved
  scope: instance
  visibility: public
  owners:
    - example.organization.stewards
  tags:
    - secrets
    - evidence
  attestations: []
spec:
  artifactType: policy
  summary:
    Secret material enters a task only through an authorized execution binding and never
    through source, prompts, artifacts, fixtures, or logs.
  statement:
    Manifests reference a secret capability by stable non-secret ID. The execution
    environment resolves that reference only for the smallest required operation. Evidence records
    whether a binding was used, not its value. A suspected exposure stops the task and invokes the
    organization's rotation and incident procedure.
  scope:
    Applies to repositories, local tasks, agent context, build systems, platform uploads,
    diagnostics, and generated evidence.
  provenance:
    - source: https://owasp.org/www-project-application-security-verification-standard/
      sourceType: standard
      note: OWASP Application Security Verification Standard
    - source: https://csrc.nist.gov/pubs/sp/800/218/final
      sourceType: standard
      note: NIST Secure Software Development Framework (SP 800-218)
  relations:
    - type: applies-to
      target:
        id: frontend.client.verification.evidence
        version: 0.2.0
    - type: applies-to
      target:
        id: example.organization.scenario.governed.change
        version: 0.2.0
  validation:
    - type: schema
      status: pending
    - type: scenario
      status: pending
      target:
        id: example.organization.scenario.governed.change
        version: 0.2.0
    - type: review
      status: pending
  contractRefs: []
