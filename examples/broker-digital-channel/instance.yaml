schemaVersion: coga.dev/v0.1
kind: CogaInstance
metadata:
  id: instance.broker.digital.customer.channel
  title: Broker Digital Customer Channel Example
  version: 0.1.0
  lifecycle: candidate
  scope: instance
  visibility: public
  owners:
    - example.domain.stewards
  tags:
    - public-example
    - broker-channel
spec:
  domain:
    name: Broker digital customer channels
    boundary: >-
      Client-facing digital channels that present broker-supplied information and
      capabilities while delegating identity, entitlement, suitability, account,
      transaction, and recordkeeping authority to trusted backend systems.
    nonGoals:
      - Brokerage transaction processing, order routing, clearing, custody, or ledger systems.
      - Investment research computation, pricing models, portfolio engines, or FICANT capabilities.
      - A production compliance baseline or interpretation of law for any organization.
      - Organization-specific campaign operations, customer segmentation, or entitlement amounts.
      - A replacement for authoritative backend identity, suitability, or permission decisions.
  packages:
    - id: broker.digital.channel.domain
      version: 0.1.0
      path: packages/domain/package.yaml
    - id: wechat.miniprogram.platform
      version: 0.1.0
      path: packages/platform-wechat-mini-program/package.yaml
    - id: frontend.client.engineering
      version: 0.1.0
      path: packages/engineering-frontend/package.yaml
    - id: example.broker.organization
      version: 0.1.0
      path: packages/organization-example/package.yaml
    - id: client.application.operations
      version: 0.1.0
      path: packages/operations-client/package.yaml
  applications:
    - id: application.aster.mini.program
      version: 0.1.0
      path: applications/aster-mini-program/application.yaml
    - id: application.cedar.insight.h5
      version: 0.1.0
      path: applications/cedar-insight-h5/application.yaml
  governance:
    approvalRequiredFor:
      - published
    policyRefs:
      - example.organization.change.approval
      - example.organization.secret.isolation
      - example.organization.publication.allowlist
    extensions:
      sourceOfTruth: versioned-files
      publishRule: human-review-and-evidence-required
      candidateForm: ui/artifact-candidate.form.schema.json
      factoryReviewForm: ui/factory-change.form.schema.json
      factoryProfile: factory/profile.yaml
      releaseInputs: factory/releases/broker-channel-0.1.0.inputs.yaml
      reviewPolicy: docs/knowledge-governance.md
