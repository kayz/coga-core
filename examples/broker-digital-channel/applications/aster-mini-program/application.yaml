schemaVersion: coga.dev/v0.1
kind: Application
metadata:
  id: application.aster.mini.program
  title: Aster Learning Mini Program
  version: 0.1.0
  lifecycle: candidate
  scope: application
  visibility: public
  owners:
    - example.application.aster
  tags:
    - fictitious
    - mini-program
spec:
  deliveryTargets:
    - wechat-miniapp
  harnessDependencies:
    - id: broker.digital.channel.domain
      version: 0.1.0
    - id: wechat.miniprogram.platform
      version: 0.1.0
    - id: frontend.client.engineering
      version: 0.1.0
    - id: example.broker.organization
      version: 0.1.0
    - id: client.application.operations
      version: 0.1.0
  contracts:
    - id: contract.example.customer.context
      version: 0.1.0
      path: ../../contracts/customer-context.schema.json
    - id: contract.example.content.feed
      version: 0.1.0
      path: ../../contracts/content-item.schema.json
    - id: contract.example.feedback.command
      version: 0.1.0
      path: ../../contracts/feedback-command.schema.json
  scenarios:
    - id: broker.channel.scenario.identity.and.entitlement
      version: 0.1.0
    - id: broker.channel.scenario.content.and.suitability
      version: 0.1.0
    - id: wechat.miniprogram.scenario.session.and.privacy
      version: 0.1.0
    - id: wechat.miniprogram.scenario.delivery
      version: 0.1.0
    - id: frontend.client.scenario.contract.and.state
      version: 0.1.0
    - id: client.operations.scenario.release
      version: 0.1.0
  operations:
    runbooks:
      - id: client.operations.incident.triage
        version: 0.1.0
      - id: client.operations.release.rollback
        version: 0.1.0
  choices:
    factoryRecipe: recipe.broker.channel.wechat.miniapp@0.1.0
    materializationCandidate: candidate.application.aster.mini.program@0.1.0
    criticalJourneys:
      - application.aster.journey.open.briefing
      - application.aster.journey.submit.feedback
    recoveryStrategy: >-
      Bind the target's approved version-management mechanism and preserve a
      last-known-good candidate before promotion.
    productBoundary: >-
      A fictitious educational briefing experience with optional customer-only
      views; it does not place orders or calculate suitability.
    navigationModel: tabbed-mini-program-shell
    contentPresentation: source-time-and-disclosure-visible
    authorizationPresentation: explain-locked-capabilities-without-inferring-access
    packageBudgets: declared-and-tested-in-application-repository
