schemaVersion: coga.dev/v0.1
kind: Application
metadata:
  id: application.cedar.insight.h5
  title: Cedar Market Context H5
  version: 0.1.0
  lifecycle: candidate
  scope: application
  visibility: public
  owners:
    - example.application.cedar
  tags:
    - fictitious
    - h5
spec:
  deliveryTargets:
    - web-h5
  harnessDependencies:
    - id: broker.digital.channel.domain
      version: 0.1.0
    - id: frontend.client.engineering
      version: 0.1.0
    - id: example.broker.organization
      version: 0.1.0
    - id: client.application.operations
      version: 0.1.0
  contracts:
    - id: contract.example.customer.context
      version: 0.1.0
      path: ../../contracts/customer-context.schema.json
    - id: contract.example.content.feed
      version: 0.1.0
      path: ../../contracts/content-item.schema.json
    - id: contract.example.support.request
      version: 0.1.0
      path: ../../contracts/support-request.schema.json
  scenarios:
    - id: broker.channel.scenario.identity.and.entitlement
      version: 0.1.0
    - id: broker.channel.scenario.content.and.suitability
      version: 0.1.0
    - id: broker.channel.scenario.data.denial
      version: 0.1.0
    - id: frontend.client.scenario.contract.and.state
      version: 0.1.0
    - id: frontend.client.scenario.accessibility
      version: 0.1.0
    - id: client.operations.scenario.incident
      version: 0.1.0
  operations:
    runbooks:
      - id: client.operations.incident.triage
        version: 0.1.0
      - id: client.operations.release.rollback
        version: 0.1.0
  choices:
    criticalJourneys:
      - application.cedar.journey.read.market.context
      - application.cedar.journey.request.support
    recoveryStrategy: >-
      Bind immutable web assets to an approved reversible release mechanism and
      verify the restored journey from an external user path.
    productBoundary: >-
      A fictitious mobile-web context reader with a support-request handoff; it does
      not provide personalized recommendations or transaction actions.
    navigationModel: responsive-document-shell
    initialAccess: public-summary-with-authoritative-customer-upgrade
    accessibilityTarget: wcag.2.2.aa-for-core-journeys
    staleContentPresentation: keep-visible-with-source-time-and-stale-label
